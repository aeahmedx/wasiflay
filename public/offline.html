<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Offline · Wasif Lay</title>
<!--
  Only reached when a page has never been visited on this device and
  there's no signal to fetch it. Anything already seen is served from
  cache instead, so this is now rare rather than the default.

  Self-contained: every style inline, nothing external to fail.
-->
<style>
  :root { color-scheme: light dark; }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; }
  body {
    display: flex; align-items: center; justify-content: center; padding: 24px;
    background: #fbf8f2; color: #1a140c;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    -webkit-font-smoothing: antialiased;
    touch-action: manipulation;
  }
  .card { max-width: 320px; width: 100%; text-align: center; }
  .mark {
    width: 56px; height: 56px; margin: 0 auto 20px;
    display: flex; align-items: center; justify-content: center;
    background: #f5a623; border-radius: 14px;
  }
  h1 { margin: 0 0 8px; font-size: 20px; font-weight: 600; letter-spacing: -0.02em; }
  p  { margin: 0; font-size: 15px; line-height: 1.5; color: #5e5242; }
  .status { margin-top: 16px; font-size: 13px; color: #7c6d59; }
  .actions { margin-top: 22px; display: flex; flex-direction: column; gap: 10px; }
  button {
    width: 100%; padding: 13px 16px; border: 0; border-radius: 10px;
    font-size: 15px; font-weight: 600; font-family: inherit; cursor: pointer;
    touch-action: manipulation;
  }
  .primary { background: #46300c; color: #fff; }
  .ghost { background: transparent; color: #5e5242; border: 1px solid #d2c3aa; }
  @media (prefers-color-scheme: dark) {
    body { background: #202124; color: #f9f4e8; }
    p, .status { color: #c4b696; }
    .primary { background: #f5a623; color: #202124; }
    .ghost { color: #c4b696; border-color: #5f6368; }
  }
</style>
</head>
<body>
  <div class="card">
    <div class="mark" aria-hidden="true">
      <svg width="34" height="34" viewBox="0 0 64 64">
        <g transform="translate(32 32) rotate(12) scale(0.9) translate(-32 -32)"
           fill="none" stroke="#2b1d07" stroke-width="3.6" stroke-linejoin="round">
          <path d="M29.5 8 h5 v48 h-5 z"/>
          <path d="M34.5 15 h16 l6 5.5 -6 5.5 h-16 z"/>
          <path d="M29.5 27 h-15 l-6 5.5 6 5.5 h15 z"/>
          <path d="M34.5 34 h13 l6 5.5 -6 5.5 h-13 z"/>
        </g>
      </svg>
    </div>

    <h1>Haven't loaded this one yet</h1>
    <p>This page hasn't been opened on this device, so there's nothing saved to show. Anything you've already seen still works.</p>

    <div class="status" id="status">Watching for signal…</div>

    <div class="actions">
      <button class="primary" id="back">Go back</button>
      <button class="ghost" id="feed">Open the feed</button>
    </div>
  </div>

<script>
(function () {
  var status = document.getElementById("status");

  /**
   * Going back only helps if there's a cached page behind us. The
   * service worker keeps pages you've visited, so in practice there
   * usually is — but if the previous entry also fails, the browser's
   * own error page would appear and there'd be no way out. So we watch
   * for that and fall back to the feed.
   */
  document.getElementById("back").addEventListener("click", function () {
    if (history.length > 1) {
      var left = false;
      addEventListener("pagehide", function () { left = true; });
      history.back();
      // If we're still here a beat later, the previous page couldn't be
      // served either.
      setTimeout(function () {
        if (!left) location.href = "/";
      }, 700);
    } else {
      location.href = "/";
    }
  });

  document.getElementById("feed").addEventListener("click", function () {
    location.href = "/";
  });

  // Leaves by itself when signal returns, so nobody sits tapping.
  var tries = 0;
  function check() {
    fetch("/manifest.webmanifest", { method: "HEAD", cache: "no-store" })
      .then(function () { location.reload(); })
      .catch(function () {
        tries++;
        status.textContent = "Watching for signal…";
        setTimeout(check, Math.min(3000 * Math.pow(1.6, tries), 30000));
      });
  }
  addEventListener("online", check);
  setTimeout(check, 2000);
})();
</script>
</body>
</html>
